<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDORA - Logic Challenge</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <div>🧠 MINDORA</div>
            <div>⭐ Score: <span id="score">0</span></div>
        </div>

        <div class="question-box">
            <p class="game-label">🧩 LOGIC CHALLENGE</p>
            <p>Question <span id="questionNumber">1</span> / 10</p>

            <div class="timer">⏱️ <span id="timer">15</span></div>

            <h1 id="question"></h1>
            <div class="options" id="options"></div>
            <p id="result"></p>

            <button id="nextBtn" onclick="nextQuestion()">
    NEXT →
</button>
        </div>
    </div>
        <script>
const questions = [
    { question: "What comes next? 2 → 4 → 8 → 16 → ?", options: ["20", "24", "32", "36"], answer: "32" },
    { question: "What comes next? 5 → 10 → 15 → 20 → ?", options: ["22", "25", "30", "35"], answer: "25" },
    { question: "What comes next? 1 → 3 → 5 → 7 → ?", options: ["8", "9", "10", "11"], answer: "9" },
    { question: "What comes next? 10 → 20 → 30 → 40 → ?", options: ["45", "50", "55", "60"], answer: "50" },
    { question: "What comes next? 3 → 6 → 12 → 24 → ?", options: ["36", "42", "48", "50"], answer: "48" },
    { question: "What comes next? 100 → 90 → 80 → 70 → ?", options: ["50", "55", "60", "65"], answer: "60" },
    { question: "What comes next? 2 → 6 → 18 → 54 → ?", options: ["108", "162", "216", "324"], answer: "162" },
    { question: "What comes next? 1 → 4 → 9 → 16 → ?", options: ["20", "24", "25", "30"], answer: "25" },
    { question: "What comes next? 10 → 15 → 20 → 25 → ?", options: ["28", "30", "35", "40"], answer: "30" },
    { question: "What comes next? 2 → 5 → 8 → 11 → ?", options: ["12", "13", "14", "15"], answer: "14" },
    { question: "What comes next? 4 → 8 → 16 → 32 → ?", options: ["48", "56", "64", "72"], answer: "64" },
    { question: "What comes next? 7 → 14 → 21 → 28 → ?", options: ["32", "35", "36", "40"], answer: "35" },
    { question: "What comes next? 2 → 3 → 5 → 8 → ?", options: ["11", "12", "13", "14"], answer: "13" },
    { question: "What comes next? 20 → 18 → 16 → 14 → ?", options: ["10", "11", "12", "13"], answer: "12" },
    { question: "What comes next? 1 → 2 → 4 → 8 → ?", options: ["12", "14", "16", "18"], answer: "16" },
    { question: "What comes next? 5 → 15 → 25 → 35 → ?", options: ["40", "45", "50", "55"], answer: "45" },
    { question: "What comes next? 81 → 27 → 9 → 3 → ?", options: ["1", "2", "0", "6"], answer: "1" },
    { question: "What comes next? 6 → 12 → 18 → 24 → ?", options: ["28", "30", "32", "36"], answer: "30" },
    { question: "What comes next? 9 → 18 → 36 → 72 → ?", options: ["108", "124", "144", "150"], answer: "144" },
    { question: "What comes next? 50 → 45 → 40 → 35 → ?", options: ["25", "28", "30", "32"], answer: "30" },
    { question: "What comes next? 3 → 9 → 27 → 81 → ?", options: ["162", "243", "324", "729"], answer: "243" },
    { question: "What comes next? 2 → 4 → 12 → 48 → ?", options: ["96", "120", "180", "240"], answer: "240" },
    { question: "What comes next? 11 → 22 → 44 → 88 → ?", options: ["132", "166", "176", "188"], answer: "176" },
    { question: "What comes next? 64 → 32 → 16 → 8 → ?", options: ["2", "4", "6", "10"], answer: "4" },
    { question: "What comes next? 1 → 1 → 2 → 3 → 5 → ?", options: ["6", "7", "8", "9"], answer: "8" },
    { question: "What comes next? 4 → 7 → 10 → 13 → ?", options: ["15", "16", "17", "18"], answer: "16" },
    { question: "What comes next? 2 → 8 → 32 → 128 → ?", options: ["256", "384", "512", "640"], answer: "512" },
    { question: "What comes next? 100 → 50 → 25 → ?", options: ["10", "12.5", "15", "20"], answer: "12.5" },
    { question: "What comes next? 13 → 26 → 52 → 104 → ?", options: ["156", "208", "210", "214"], answer: "208" },
    { question: "What comes next? 1 → 4 → 7 → 10 → ?", options: ["11", "12", "13", "14"], answer: "13" }
];
let currentQuestion = 0;
let score = 0;
let levelCorrect = 0;
let timerValue = 15;
let timerInterval = null;
let answerLocked = false;

function startTimer() {
    clearInterval(timerInterval);
    timerValue = 15;
    document.getElementById("timer").textContent = timerValue;

    timerInterval = setInterval(() => {
        timerValue--;
        document.getElementById("timer").textContent = timerValue;

        if (timerValue <= 0) {
            clearInterval(timerInterval);
            handleTimeOut();
        }
    }, 1000);
}

function handleTimeOut() {
    if (answerLocked) return;

    answerLocked = true;
    const q = questions[currentQuestion];
    const result = document.getElementById("result");

    document.querySelectorAll(".answer-btn").forEach((button) => {
        button.disabled = true;
        if (button.textContent === q.answer) {
            button.classList.add("correct");
        }
    });

    result.textContent = "⏰ Time up! Correct answer: " + q.answer;
    document.getElementById("nextBtn").style.display = "block";
}

function checkAnswer(selectedAnswer) {
    if (answerLocked) return;

    answerLocked = true;
    clearInterval(timerInterval);

    const q = questions[currentQuestion];
    const result = document.getElementById("result");

    document.querySelectorAll(".answer-btn").forEach((button) => {
        button.disabled = true;

        if (button.textContent === q.answer) {
            button.classList.add("correct");
        }

        if (button.textContent === selectedAnswer && selectedAnswer !== q.answer) {
            button.classList.add("wrong");
        }
    });

    if (selectedAnswer === q.answer) {
        score += 10;
        levelCorrect++;
        document.getElementById("score").textContent = score;
        result.textContent = "✅ Correct! +10 XP";
    } else {
        result.textContent = "❌ Wrong! Correct answer: " + q.answer;
    }

    document.getElementById("nextBtn").style.display = "block";
}

function loadQuestion() {
    if (currentQuestion >= questions.length) {
        document.getElementById("question").textContent = "🏆 All Levels Completed!";
        document.getElementById("options").innerHTML = "";
        document.getElementById("result").textContent = "🎉 Congratulations! Final Score: " + score;
        document.getElementById("nextBtn").style.display = "none";
        return;
    }

    const q = questions[currentQuestion];
    const level = Math.floor(currentQuestion / 10) + 1;
    const questionInLevel = (currentQuestion % 10) + 1;

    document.getElementById("question").textContent = q.question;
    document.getElementById("questionNumber").textContent = "Level " + level + " - Question " + questionInLevel + "/10";
    document.getElementById("score").textContent = score;
    document.getElementById("result").textContent = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsBox = document.getElementById("options");
    optionsBox.innerHTML = "";
    answerLocked = false;

    q.options.forEach((option) => {
        const button = document.createElement("button");
        button.textContent = option;
        button.className = "answer-btn";
        button.disabled = false;
        button.onclick = function () {
            checkAnswer(option);
        };
        optionsBox.appendChild(button);
    });

    startTimer();
}
function nextQuestion() {

    currentQuestion++;

    // 10 questions completed
    if (currentQuestion % 10 === 0) {

        const completedLevel = currentQuestion / 10;

        document.getElementById("question").textContent =
            "🎉 LEVEL " + completedLevel + " COMPLETED!";

        document.getElementById("options").innerHTML = "";

        document.getElementById("result").textContent =
            "Correct Answers: " + levelCorrect + " / 10";

        // Next level irundha
        if (currentQuestion < questions.length) {

            // NEXT button visible-aa irukkum
            document.getElementById("nextBtn").style.display = "block";

            // next click-ku level count reset
            levelCorrect = 0;

        } else {

            // Last level complete
            document.getElementById("result").textContent =
                "🏆 ALL LEVELS COMPLETED! Correct Answers: " +
                levelCorrect + " / 10";

            document.getElementById("nextBtn").style.display = "none";
        }

        return;
    }

    loadQuestion();
}



loadQuestion();
</script>
        
</body>

</html>
