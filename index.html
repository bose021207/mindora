if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
            .then(() => {
                console.log("Mindora Service Worker Registered");
            })
            .catch((error) => {
                console.log("Service Worker Error:", error);
            });
    });
}
